<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>析域 · 插件面板联调</title>
    <link rel="stylesheet" href="./dev.css" />
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="host"></div>
    <div id="devbar">联调页 · tools/dev-server.mjs</div>
    <!--
      在浏览器里跑真实的插件产物（仓库根的 client.js）：
      1) 伪造 __ModuleLoader__，把 react 从 UMD 全局递给工厂；
      2) 伪造 ctx（只实现 slots.inject / slots.register 与 effect）；
      3) 把面板组件挂到 #host。
      网络请求不做任何映射：tools/dev-server.mjs 已经在同源上跑真实的
      /synapsis-api/*（同一个 lib/http.mjs），所以联调页看到的是生产行为。
    -->
    <script>
      window.__ModuleLoader__ = {
        load(def) {
          window.__synapsisMod = def.factory((name) => {
            if (name === 'react') return window.React
            throw new Error('unknown module: ' + name)
          })
        },
      }

      window.__panels = {}
      window.__effects = []
      const ctx = {
        effect(fn) {
          const dispose = fn()
          window.__effects.push(dispose)
          return dispose
        },
        slots: {
          inject(slot, fn) {
            fn()
          },
          register(config, component) {
            window.__panels[config.key || config.id || 'x'] = component
            return () => {}
          },
        },
      }
    </script>
    <script src="/synapsis-api/_client.js"></script>
    <script>
      window.__panels.hostPanel = window.__panels['dsh-synapsis'] || window.__panels.synapsis
      window.__synapsisMod.apply(ctx)
      const Panel = window.__panels['dsh-synapsis'] || window.__panels.synapsis
      ReactDOM.createRoot(document.getElementById('host')).render(React.createElement(Panel))
    </script>
  </body>
</html>
